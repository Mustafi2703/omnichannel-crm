services:
  - type: web
    name: omnichannel-crm
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: omnichannel-crm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: AISENSY_API_KEY
        sync: false
      - key: AISENSY_API_URL
        sync: false
      - key: AISENSY_WEBHOOK_SECRET
        sync: false
      - key: DEFAULT_TENANT_SLUG
        value: demo-sirket
      - key: NODE_VERSION
        value: "22"
      - key: HOSTNAME
        value: "0.0.0.0"

databases:
  - name: omnichannel-crm-db
    plan: free
    region: frankfurt
    databaseName: omnicrm
    user: omnicrm
