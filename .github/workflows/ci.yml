name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, type-check, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Prisma generation validates the datasource shape but does not connect during build.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/omnicrm?schema=public
      JWT_SECRET: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Production build
        run: npm run build
